        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: rgb(var(--loader-fg));

      #loader svg { width: 32px; height: 32px; opacity: 0.45; }

        position: absolute;
        bottom: 50%;
        left: 50%;
        transform: translate(-50%, 40px);
        width: 100px;
        height: 2px;
        background: rgba(var(--loader-fg), 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      #loader .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: rgba(var(--loader-fg), 0.25);
        border-radius: 1px;
        animation: slide 1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
